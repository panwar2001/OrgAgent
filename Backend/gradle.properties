# The IDE imports and syncs the project through the Gradle daemon, so give it room and reuse work.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Faster IDE syncs and repeat builds. Delete this line if a plugin turns out to be incompatible.
org.gradle.configuration-cache=true
