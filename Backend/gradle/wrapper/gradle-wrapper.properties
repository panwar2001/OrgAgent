# Pinned to 9.2.1 on purpose.
#
# From Gradle 9.5 the distribution's lib/ folder also ships kotlin-compiler-embeddable.properties.
# IntelliJ (verified on IDEA 2025.1.1, build 251.25410.129) puts that file on the classpath it builds
# for Kotlin DSL script definitions and then tries to open it as a jar:
#
#   java.util.zip.ZipException: zip END header not found
#     at ...KotlinDslScriptSyncContributor.onModelFetchCompleted
#
# The script model never resolves, so every dependency and reference in build.gradle.kts is shown as
# unresolved in the editor even though the command line build works perfectly. Gradle 9.2.1 has no
# .properties files in lib/, so the offending classpath entry does not exist.
#
# Before raising this version, check that the IDE in use handles it, or upgrade the IDE first.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.2.1-bin.zip
networkTimeout=10000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
